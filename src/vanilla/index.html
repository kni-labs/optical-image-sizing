    <script type="module">
      import opticallySizeImages from '/lib/index.js';

      const images = Array.from(
        document.querySelectorAll('.optically-size-images figure img'),
      );

      window.addEventListener('load', () =>
        opticallySizeImages(images, (image, opticalSize) => {
          image.style.setProperty(
            '--optical-image-size',
            opticalSize.toString(),
          );
          image.style.setProperty('opacity', '1');
        }),
      );
    </script>
